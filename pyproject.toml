[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"

[project]
name = "robot_framework"
version = "0.0.1"
authors = [
  { name="ITK Development", email="itk-rpa@mkb.aarhus.dk" },
]
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
]
dependencies = [
    "OpenOrchestrator == 3.*",
    "Pillow == 10.*",
    "selenium == 4.40.0",
    "psutil == 7.2.2",
    "pywin32 == 311",
    "pyodbc == 5.*"
]

# Without this, setuptools uses flat-layout auto-discovery and treats EVERY top-level
# directory as a candidate package. Adding sql/ and sandbox_output/ to this repo made it
# find three and refuse to build, which breaks `uv run python -m robot_framework` - i.e.
# the robot itself, not just tooling. Naming the package removes the guesswork.
[tool.setuptools]
packages = ["robot_framework"]

[project.optional-dependencies]
dev = [
  "pylint",
  "flake8"
]
